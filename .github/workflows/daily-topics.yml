name: 行业热点持续更新

on:
  schedule:
    # 避开整点拥堵；北京时间每天 08:17 和 20:17 执行。
    - cron: "17 */12 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-topics.yml"
      - "scripts/fetch_topics.py"
      - "scripts/validate_topics.py"
      - "frontend/_worker.js"
  workflow_dispatch:

concurrency:
  group: topics-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装抓取依赖
        run: pip install -r scripts/requirements.txt

      - name: 抓取并校验行业热点
        run: |
          python scripts/fetch_topics.py
          python scripts/validate_topics.py

      - name: 提交真实数据归档
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/topics-data/

          if git diff --cached --quiet; then
            echo "没有数据变化，继续部署现有有效数据"
          else
            git commit -m "自动抓取: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 行业热点更新"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "generated_at=$(python -c \"import json; print(json.load(open('frontend/public/topics-data/hot-topics.json', encoding='utf-8'))['generatedAt'])\")" >> "$GITHUB_OUTPUT"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建生产站点
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 部署到 Cloudflare Pages（凭据可用时最多重试 3 次）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare Secrets 未配置；最新数据将由 Pages Worker 从 GitHub main 发布"
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Cloudflare 部署尝试 ${attempt}/3"
            if npx --yes wrangler@4.114.0 pages deploy frontend/dist \
              --project-name=wangyulong-home \
              --branch=main \
              --commit-hash="$DEPLOY_SHA" \
              --commit-message="行业热点自动更新"; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::warning::Cloudflare 静态部署失败；继续验证 GitHub 回源数据"

      - name: 验证生产数据已切换
        env:
          EXPECTED_GENERATED_AT: ${{ steps.commit.outputs.generated_at }}
        run: |
          for attempt in 1 2 3 4; do
            curl --fail --silent --show-error \
              "https://wangyulong-home.pages.dev/api/topics?verify=${{ steps.commit.outputs.sha }}-${attempt}" \
              --output /tmp/hot-topics.json || true

            if python scripts/validate_topics.py \
              --path /tmp/hot-topics.json \
              --expected-generated-at "$EXPECTED_GENERATED_AT"; then
              echo "生产热点数据验证通过"
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1
