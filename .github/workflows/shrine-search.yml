name: 厨力研究所实时索引

on:
  schedule:
    # 北京时间每天 02:37、08:37、14:37、20:37 更新。
    - cron: "37 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/shrine-search.yml"
      - "scripts/fetch_shrine.py"
      - "scripts/validate_shrine.py"
  workflow_dispatch:

concurrency:
  group: shrine-live-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装抓取依赖
        run: pip install -r scripts/requirements.txt

      - name: 更新并校验实时索引
        run: |
          python scripts/fetch_shrine.py
          python scripts/validate_shrine.py

      - name: 提交索引
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/shrine-data/index.json

          if git diff --cached --quiet; then
            echo "索引没有变化"
            exit 0
          fi

          git commit -m "自动检索: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 厨力研究所更新"
          git pull --rebase origin main
          git push origin HEAD:main
